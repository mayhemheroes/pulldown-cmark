[package]
name = "pulldown-cmark-mayhem-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = { version = "0.4", features = ["arbitrary-derive"] }

[dependencies.pulldown-cmark]
path = "../../pulldown-cmark"

# Prevent this from interfering with the upstream workspace
[workspace]
members = ["."]

[[bin]]
name = "parse"
path = "fuzz_targets/parse.rs"
test = false
doc = false

[profile.release]
debug = 1
